name: PR Quality

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

concurrency:
  group: pr-quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  title-lint:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate PR title (Conventional Commits)
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            test
            docs
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^[a-z].+
          subjectPatternError: "Use lower-case imperative subject."

  checklist:
    permissions:
      issues: write
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - name: Check PR template sections
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body || "";
            const required = ["## Summary", "## Changes", "## Testing"];
            const missing = required.filter((s) => !body.includes(s));
            if (missing.length === 0) return;
            const marker = "<!-- pr-hygiene-bot -->";
            const note = [marker, "### Missing PR template sections", "",
              ...missing.map(s => "- " + s), "",
              "Please fill these in to help reviewers."
            ].join("\n");
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: pr.number,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            const params = { owner: context.repo.owner, repo: context.repo.repo };
            if (existing) {
              await github.rest.issues.updateComment({ ...params, comment_id: existing.id, body: note });
            } else {
              await github.rest.issues.createComment({ ...params, issue_number: pr.number, body: note });
            }
