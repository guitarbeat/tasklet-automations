name: Rebase Stale PRs via Jules

on:
  schedule:
    - cron: '0 14 * * 1'  # Every Monday at 9 AM CT (14:00 UTC)
  workflow_dispatch:        # Allow manual runs from GitHub UI

jobs:
  rebase-stale-prs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # needed for fallback @jules comment
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Rebase stale PRs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: python .github/scripts/rebase_stale_prs.py
